<svg xmlns="http://www.w3.org/2000/svg" width="671" height="518" viewBox="0 0 671 518" role="img" aria-label="simaphore settings">
<rect width="671" height="518" rx="8" fill="#1b1d23"/>
<g font-family="SF Mono, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
<text x="16" y="29" fill="#d4d4d4" font-weight="700" textLength="75.60000000000001" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Settings</text><text x="108.4" y="29" fill="#d4d4d4" opacity="0.55" textLength="294" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Apply to every session on this Mac.</text>

<text x="24.4" y="65" fill="#d4d4d4" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Simulator limit           </text><text x="242.8" y="65" fill="#d4d4d4" textLength="25.200000000000003" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[-]</text><text x="276.40000000000003" y="65" fill="#d4d4d4" font-weight="700" textLength="75.60000000000001" lengthAdjust="spacingAndGlyphs" xml:space="preserve">3        </text><text x="352" y="65" fill="#d4d4d4" textLength="25.200000000000003" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[+]</text><text x="377.2" y="65" fill="#d4d4d4" opacity="0.55" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  (default </text><text x="469.6" y="65" fill="#d4d4d4" opacity="0.55" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2</text><text x="478" y="65" fill="#d4d4d4" opacity="0.55" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">)</text>
<text x="41.2" y="83" fill="#d4d4d4" opacity="0.55" textLength="613.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Most simulators on at once. A command that needs one more waits for room.</text>
<text x="24.4" y="101" fill="#d4d4d4" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Builds at once            </text><text x="242.8" y="101" fill="#d4d4d4" textLength="25.200000000000003" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[-]</text><text x="276.40000000000003" y="101" fill="#d4d4d4" font-weight="700" textLength="75.60000000000001" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2        </text><text x="352" y="101" fill="#d4d4d4" textLength="25.200000000000003" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[+]</text>
<text x="41.2" y="119" fill="#d4d4d4" opacity="0.55" textLength="495.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">How many agent builds may run together when memory is fine.</text>
<text x="24.4" y="137" fill="#d4d4d4" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Compiler jobs             </text><text x="242.8" y="137" fill="#d4d4d4" textLength="25.200000000000003" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[-]</text><text x="276.40000000000003" y="137" fill="#d4d4d4" font-weight="700" textLength="75.60000000000001" lengthAdjust="spacingAndGlyphs" xml:space="preserve">6        </text><text x="352" y="137" fill="#d4d4d4" textLength="25.200000000000003" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[+]</text>
<text x="41.2" y="155" fill="#d4d4d4" opacity="0.55" textLength="579.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Added as -jobs to a build that has none. Lower is gentler on the Mac.</text>
<text x="24.4" y="173" fill="#d4d4d4" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Memory is tight at        </text><text x="242.8" y="173" fill="#d4d4d4" textLength="25.200000000000003" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[-]</text><text x="276.40000000000003" y="173" fill="#d4d4d4" font-weight="700" textLength="75.60000000000001" lengthAdjust="spacingAndGlyphs" xml:space="preserve">85%      </text><text x="352" y="173" fill="#d4d4d4" textLength="25.200000000000003" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[+]</text>
<text x="41.2" y="191" fill="#d4d4d4" opacity="0.55" textLength="571.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Swap used, as a percent of swap total. Past it, one build at a time.</text>
<text x="24.4" y="209" fill="#d4d4d4" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Simulator is idle after   </text><text x="242.8" y="209" fill="#d4d4d4" textLength="25.200000000000003" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[-]</text><text x="276.40000000000003" y="209" fill="#d4d4d4" font-weight="700" textLength="75.60000000000001" lengthAdjust="spacingAndGlyphs" xml:space="preserve">10 min   </text><text x="352" y="209" fill="#d4d4d4" textLength="25.200000000000003" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[+]</text>
<text x="41.2" y="227" fill="#d4d4d4" opacity="0.55" textLength="462" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Minutes under 2% CPU before a simulator counts as idle.</text>
<text x="24.4" y="245" fill="#d4d4d4" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Warn below free disk      </text><text x="242.8" y="245" fill="#d4d4d4" textLength="25.200000000000003" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[-]</text><text x="276.40000000000003" y="245" fill="#d4d4d4" font-weight="700" textLength="75.60000000000001" lengthAdjust="spacingAndGlyphs" xml:space="preserve">20 GB    </text><text x="352" y="245" fill="#d4d4d4" textLength="25.200000000000003" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[+]</text>
<text x="41.2" y="263" fill="#d4d4d4" opacity="0.55" textLength="495.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The panel warns when free disk space is under this many GB.</text>
<text x="24.4" y="281" fill="#d4d4d4" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Rename held simulators    </text><text x="242.8" y="281" fill="#d4d4d4" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[on]</text>
<text x="41.2" y="299" fill="#d4d4d4" opacity="0.55" textLength="596.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Show who has a simulator in its name, such as "🔒 feature-x · Bench 2".</text>
<text x="24.4" y="317" fill="#d4d4d4" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Plain symbols             </text><text x="242.8" y="317" fill="#d4d4d4" textLength="42" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[off]</text>
<text x="41.2" y="335" fill="#d4d4d4" opacity="0.55" textLength="478.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Draw &gt; + x * instead of the check, cross and dot symbols.</text>

<text x="16" y="371" fill="#d4d4d4" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Your simulators</text>
<text x="41.2" y="389" fill="#d4d4d4" opacity="0.55" textLength="378" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Agents never get these. Press one to mark it.</text>
<text x="41.2" y="407" fill="#d4d4d4" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[x] Bench 1</text>
<text x="41.2" y="425" fill="#d4d4d4" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[ ] Bench 2</text>
<text x="41.2" y="443" fill="#d4d4d4" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[ ] Bench 3</text>
<text x="41.2" y="461" fill="#d4d4d4" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[ ] iPhone 17 Pro</text>

<text x="24.4" y="497" fill="#d4d4d4" textLength="168" lengthAdjust="spacingAndGlyphs" xml:space="preserve">o: back to the panel</text>
</g>
</svg>
